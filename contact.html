<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us - Nexus Solutions</title>
</head>
<body>
    <header><h1>Get in Touch</h1></header>
    <main>
        <section class="contact-details">
            <h2>Headquarters</h2>
            <p><strong>Email:</strong> contact@nexussolutions.io</p>
            <p><strong>Phone:</strong> +1 (800) 555-0199</p>
            <p><strong>Operating Hours:</strong> Monday – Friday, 8:00 AM – 6:00 PM EST</p>
        </section>
        <section class="contact-form-section">
            <h2>Send an Inquiry</h2>
            <form action="#">
                <label>Company Name: <input type="text" required></label><br><br>
                <label>Work Email: <input type="email" required></label><br><br>
                <label>Inquiry Message:<br><textarea rows="4" cols="40" required></textarea></label><br><br>
                <button type="submit">Submit Inquiry</button>
            </form>
        </section>
        <section class="map-section">
            <h2>Our Location</h2>
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3151.835434509374!2d144.9537353153166!3d-37.81627977975179!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMzfCsDQ4JzU4LjYiUyAxNDTCsDU3JzEzLjQiRQ!5e0!3m2!1sen!2sus!4v1600000000000!5m2!1sen!2sus" width="400" height="250" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
        </section>
    </main>
</body>
</html>
